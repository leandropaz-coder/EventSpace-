<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · EventSpace</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="login">
  <section class="login__card">
    <div class="login__brand">
        <span class="login__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>
        </span>
      <div>
        <strong>EventSpace</strong>
        <span>Locação de salas para eventos</span>
      </div>
    </div>

    <h1>Entrar na sua conta</h1>

    <!-- Por enquanto envia direto para o dashboard.
         Troque pela chamada ao back end quando integrar a autenticação. -->
    <form action="dashboard.html" method="get">
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="username" required>
      </div>

      <div class="field">
        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" autocomplete="current-password" required>
      </div>

      <button class="btn" type="submit">Entrar</button>
    </form>
  </section>
</main>
</body>
</html>
