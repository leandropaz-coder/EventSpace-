<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Define a codificação para exibir corretamente os caracteres em português. -->
  <meta charset="UTF-8">
  <!-- Faz o layout se adaptar à largura de celulares e tablets. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Acesse o painel administrativo EventSpace">
  <title>Entrar | EventSpace</title>
  <!-- Carrega somente o CSS desta tela de login. -->
  <link rel="stylesheet" href="css/index.css">
  <!-- Compartilha a mesma paleta corporativa das páginas internas. -->
  <link rel="stylesheet" href="css/theme.css">
  <!-- defer executa o JavaScript depois que o HTML for interpretado. -->
  <script src="js/index.js" defer></script>
</head>
<body>
  <!-- main identifica o conteúdo principal desta página. -->
  <main class="login-page">
    <section class="login-card" aria-labelledby="login-title">
      <!-- Marca e nome do sistema. -->
      <div class="brand" aria-label="EventSpace">
        <span class="brand__icon" aria-hidden="true">E</span>
        <div>
          <p class="brand__name">EventSpace</p>
          <p class="brand__description">Gestão de espaços para eventos</p>
        </div>
      </div>

      <div class="intro">
        <p class="eyebrow">ÁREA ADMINISTRATIVA</p>
        <h1 id="login-title">Acesse sua conta</h1>
        <p>Entre com seu CPF e senha para continuar.</p>
      </div>

      <!-- O JavaScript intercepta o envio e chama POST /login sem recarregar a página. -->
      <form id="login-form">
        <div class="field">
          <label for="login">CPF</label>
          <!-- O backend recebe o CPF no campo "login", não um endereço de e-mail. -->
          <input
            id="login"
            name="login"
            type="text"
            inputmode="numeric"
            autocomplete="username"
            placeholder="Digite seu CPF"
            required
          >
        </div>

        <div class="field">
          <label for="senha">Senha</label>
          <input
            id="senha"
            name="senha"
            type="password"
            autocomplete="current-password"
            placeholder="Digite sua senha"
            required
          >
        </div>

        <!-- Mensagens de carregamento, sucesso e falha aparecem aqui. -->
        <p class="feedback" id="feedback" role="status" aria-live="polite" hidden></p>

        <button class="submit-button" id="submit-button" type="submit">
          <span id="button-label">Entrar</span>
          <span class="button-arrow" aria-hidden="true">→</span>
        </button>
      </form>

      <p class="security-note">
        <span aria-hidden="true">●</span>
        Acesso protegido por autenticação
      </p>
    </section>

    <!-- Texto decorativo que complementa a apresentação em telas maiores. -->
    <aside class="side-note" aria-hidden="true">
      <span class="side-note__line"></span>
      <p>Seu espaço.<br>Seu próximo evento.</p>
      <span class="side-note__caption">EVENTSPACE · PAINEL DE GESTÃO</span>
    </aside>
  </main>
</body>
</html>
